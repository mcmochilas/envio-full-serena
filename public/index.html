<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* celular da separação: sem zoom automático ao focar/desfocar o campo de bipe */ if(/^#s-/.test(location.hash)) document.querySelector('meta[name=viewport]').setAttribute("content","width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no");</script>
<title>Envio Full · Serena</title>
<meta name="theme-color" content="#0F3A4E">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="apple-mobile-web-app-title" content="Envio Full">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Identidade Serena (mesma do app de consulta de preço): petróleo + areia + dourado. Gestor = sidebar petróleo; expedição = barra petróleo e bancada clara */
  --bg:#F5F2ED; --surface:#FFFFFF; --ink:#143F54; --ink2:#3C4E58; --muted:#5B6970; --line:#E4DED3; --line2:#F0EBE3;
  --petrol:#164C64; --petrol-d:#0F3A4E; --accent:#8A6526; --accent-soft:#FBF0DF; --gold:#FFD195;
  --ok:#16658A; --ok-soft:#E3EEF3; --warn:#A84B08; --warn-soft:#FBEEE3; --err:#A3281C; --err-soft:#FBE6E3; --off:#6B7378; --off-soft:#EEEBE6;
  --display:"Montserrat",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--body);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}

.inp{height:46px;border:1px solid #D6D3CC;border-radius:12px;padding:0 14px;background:var(--surface);width:100%;font-size:16px}
textarea.inp{height:auto;min-height:150px;padding:10px 12px;font-family:var(--mono);font-size:13px;resize:vertical}
select.inp{height:40px;font-size:14px;padding:0 10px;border-radius:10px}
.btn{height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid #D6D3CC;background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.btn-dark:hover{background:var(--petrol-d)}
.btn-sm{height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag-ok{color:var(--ok);background:var(--ok-soft)}.tag-warn{color:var(--warn);background:var(--warn-soft)}.tag-acc{color:var(--accent);background:var(--accent-soft)}.tag-off{color:#4E4E55;background:var(--off-soft)}.tag-err{color:var(--err);background:var(--err-soft)}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.2em;text-transform:uppercase}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.5}

/* login */
.lg{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--petrol-d)}
.lg-card{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:28px 24px;border-top:4px solid var(--gold);display:flex;flex-direction:column;gap:14px}
.lg-brand{display:block;width:210px;max-width:70%;height:auto;margin:0 auto 6px}
.lg-sub{text-align:center;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-top:-4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600;color:var(--ink2)}

/* gestor */
.ad{display:flex;flex-wrap:wrap;min-height:100%}
.ad nav{flex:1 1 220px;max-width:100%;background:var(--petrol-d);color:#F7F4EF;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.navb{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#E3ECF0;text-align:left;font-size:14px;font-weight:600}
.navb[aria-current="page"]{background:#F7F4EF;color:var(--petrol-d);box-shadow:inset 3px 0 0 var(--gold)}
.badge{font-size:12px;font-weight:700;background:var(--gold);color:var(--ink);border-radius:999px;padding:2px 8px}
.navfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.navlink{border:1px solid #3C6E86;background:transparent;color:#F7F4EF;border-radius:10px;min-height:42px;font-size:13px;font-weight:700}
.ad main{flex:999 1 560px;min-width:0;padding:32px 32px 48px;display:flex;flex-direction:column;gap:20px}
@media (max-width:640px){.ad main{padding:20px 14px 40px}}
.hdr{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hdr h1{font-size:28px;letter-spacing:-.02em}
.box{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.box h2{font-weight:600;font-size:17px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.tbox{background:var(--surface);border-radius:16px;overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.t th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.clk{cursor:pointer}.t tr.clk:hover td{background:#FBF8F2}
.t tr.flag td{background:var(--accent-soft)}
.r{text-align:right}
.note{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.note.ok{background:var(--ok-soft);color:var(--ok)}.note.warn{background:var(--warn-soft);color:var(--warn)}
.note button.lnk{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:0}

/* expedição */
.ex{min-height:100%;display:flex;flex-direction:column}
.xtop{background:var(--petrol-d);color:#F7F4EF;min-height:62px;padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.xtop img{height:32px;width:auto;display:block}
.xtop small{font-size:12px;color:#B7CAD4;border-left:1px solid #3C6E86;padding-left:12px;line-height:1.25}
.xtop .sp{flex:1}
.xbtn{height:38px;border:1px solid #3C6E86;background:transparent;color:#F7F4EF;border-radius:10px;padding:0 12px;font-size:13px;font-weight:700}
.xbody{flex:1;width:100%;margin:0;padding:24px 20px 48px;display:flex;flex-direction:column;gap:18px}
.ecard{background:var(--surface);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.ecard h2{font-size:20px}
.bar{height:8px;background:var(--line2);border-radius:999px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.full{background:var(--ok)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.steps span b{font-family:var(--mono);font-weight:500}
.steps span.on{background:var(--ink);color:#F7F4EF;border-color:var(--ink)}
.steps span.done{color:var(--ok);border-color:#BFD6E1}
.hero{background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:26px}
.diff{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.diff b{font-size:15px}
.oklist summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ok)}
.oklist ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--ink2)}

.bench{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.bench{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.scan{display:flex;gap:8px}
.scan .inp{height:56px;font-family:var(--mono);font-size:20px;letter-spacing:.03em;border:2px solid var(--petrol)}
.scan .btn{height:56px}
.status{border-radius:18px;padding:22px 22px;background:var(--surface);border-left:8px solid var(--line)}
.status.ok{border-left-color:var(--ok)}
.status.err{border-left-color:var(--err);background:var(--err-soft)}
.status.wait{border-left-color:var(--gold);background:var(--accent-soft)}
.status .big{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.015em}
.status .sub{margin-top:6px;font-size:15px;color:var(--ink2)}
.status .code{font-family:var(--mono);font-weight:500;background:var(--surface);border-radius:6px;padding:1px 6px}
.kit{display:flex;gap:4px;margin-top:12px}
.kit span{width:22px;height:22px;border-radius:6px;background:var(--line2);border:1px solid var(--line)}
.kit span.on{background:var(--petrol);border-color:var(--petrol)}
.panel{background:var(--surface);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.panel h3{font-size:16px;margin-bottom:4px}
.pi{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.pi:last-child{border-bottom:0}
.pi .t1{font-weight:600;font-size:14px}
.pi .t2{font-size:12px;color:var(--muted)}
.pi .bar{height:5px;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.log{max-height:200px;overflow-y:auto;font-size:13px}
.log div{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.log .tm{font-family:var(--mono);color:var(--muted);font-size:12px}
.log .e{color:var(--err)}
.sim{border:1px dashed #C9B48A;border-radius:16px;padding:14px 16px;background:#FBF8F2}
.sim summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent)}
.simg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.simg button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px}
.simg button small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.cx{background:var(--surface);border-radius:16px;padding:16px 18px}
.cx h3{font-size:16px}
.cx ul{margin:8px 0 0;padding-left:18px;font-size:14px}
pre.res{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font:12px/1.5 var(--mono);margin:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--petrol-d);color:#F7F4EF;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.who{font-size:13px;font-weight:700;background:#164C64;border-radius:999px;padding:6px 12px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:980px){.work{grid-template-columns:1fr}}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sum{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.sum b{font-family:var(--display);font-size:24px;line-height:1.1}
.sum span{font-size:12px;color:var(--muted);font-weight:600}
.sum.hl{background:var(--accent-soft)}.sum.hl b{color:var(--accent)}
.irow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(90px,1fr) minmax(80px,1fr) minmax(300px,1.6fr);gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.irow:last-child{border-bottom:0}
.irow.sel{background:var(--accent-soft);margin:0 -20px;padding:12px 20px}
@media (max-width:640px){.irow{grid-template-columns:1fr}}
.ist{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
@media (max-width:640px){.ist{align-items:flex-start}}
.t1{font-weight:700;font-size:14px}.t2{font-size:12px;color:var(--muted)}
.okmark{color:var(--ok);font-weight:700;font-size:13px}
.lblp{border:2px solid var(--gold)}
.lhd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.plan{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.pl{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px}
.pl b{font-family:var(--display);font-size:20px}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:6px;justify-content:start;max-height:260px;overflow-y:auto;background:#EDE9E2;padding:10px;border-radius:10px}
.etq{background:#fff;border:1px solid #D9D4CA;border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;color:#111}
.etq .eb svg{width:100%;height:26px;display:block;fill:#111}
.etq b{font-size:11px}.etq span{font-size:10px;line-height:1.2;color:#333}
.lmsg{border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
.lmsg.ok{background:var(--ok-soft);color:var(--ok)}.lmsg.err{background:var(--err-soft);color:var(--err)}
.simd summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:8px 0}
.side{position:sticky;top:12px}
.qrbox{align-items:center;text-align:center}
.qr{width:180px;height:180px;background:#fff;border-radius:12px;padding:6px}
.qr svg{width:100%;height:100%;display:block}
.simwrap{display:flex;flex-direction:column;gap:10px}
.simhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:8px;height:30px;padding:0 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#F7F4EF}
.phone{width:100%;max-width:360px;margin:0 auto;height:620px;overflow-y:auto;background:var(--bg);border:10px solid #1B2A33;border-radius:34px}
.phonefull{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg)}
.ptop{position:sticky;top:0;z-index:2;background:var(--petrol-d);color:#F7F4EF;display:flex;align-items:center;gap:10px;padding:12px 14px}
.ptop img{height:26px;width:auto}
.ptop b{display:block;font-family:var(--display);font-size:15px}.ptop small{font-size:12px;color:#B7CAD4}
.pbody{padding:14px;display:flex;flex-direction:column;gap:10px}
.psec{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pitem2{background:var(--surface);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pback{border:0;background:none;font-weight:700;color:var(--ink);padding:4px 0;align-self:flex-start}
.pcard2{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pcard2 h2{font-size:20px}
.pcount{display:flex;align-items:baseline;gap:8px}
.pcount b{font-family:var(--display);font-size:52px;line-height:1}
.pcount span{font-weight:700;color:var(--muted)}
.pbig{height:54px;width:100%}
.pscan{display:flex;gap:8px}.pscan .inp{font-family:var(--mono)}
.lnkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px 0;align-self:center}
.drop{display:flex;flex-direction:column;gap:4px;border:2px dashed #C9B48A;border-radius:14px;padding:18px;background:#FBF8F2;cursor:pointer}
.drop b{font-size:15px}.drop span{font-size:13px;color:var(--muted)}
.drop input{margin-top:6px;font-size:13px}
.etq .eb svg{height:30px}
.sheet{grid-template-columns:repeat(2,minmax(0,200px))}
.oklist summary{color:var(--ink)}
.t th.r,.t td.r{text-align:right}
#app{min-height:100vh}
.ad,.ex,.lg{min-height:100vh}
.ad nav{align-self:stretch;position:sticky;top:0;height:100vh;overflow-y:auto}
@media (max-width:780px){.ad nav{position:static;height:auto}}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.manbox{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.mhd{color:var(--accent);font-size:14px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
:root{--floor:#E9E4DB;--rack:#C9BFAE;--route:#164C64}
.map-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:6px}
.map-card svg{display:block;width:100%;height:auto;max-height:360px;margin:0 auto}
.m-floor{fill:var(--floor)}.m-cell{fill:var(--rack)}.m-rack{fill:var(--rack)}
.m-rua{fill:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;opacity:.75}
.m-wall{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round;opacity:.6}
.m-cell.target{fill:var(--accent)}.m-lane{fill:var(--gold);opacity:0}
.m-dock{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.m-dock-t{fill:var(--muted);font-family:var(--body);font-weight:600;font-size:9px;letter-spacing:.1em}
.m-route{fill:none;stroke:var(--route);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.m-op{fill:var(--route);stroke:var(--surface);stroke-width:2.5}
.m-pin{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.m-ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0;transform-box:fill-box;transform-origin:center}
.m-prev{fill:var(--surface);stroke:var(--route);stroke-width:2}
.arrived .m-lane{opacity:.35;transition:opacity .5s}
@media (prefers-reduced-motion:no-preference){.arrived .m-ring{animation:ring 1.6s ease-out infinite}.arrived .m-cell.target{animation:blink 1.6s ease-in-out infinite}}
@keyframes ring{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
@keyframes blink{50%{opacity:.55}}
.loc-code{font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:.02em;line-height:1.1}
.locpill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:500;background:var(--ink);color:#F7F4EF;border-radius:6px;padding:2px 7px;margin-bottom:4px}
.ploc{gap:4px}
.zsheet{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;background:#EDE9E2;padding:10px;border-radius:10px;align-items:flex-start}
.zpg{width:100%;max-width:480px;height:auto;display:block;background:#fff;box-shadow:0 0 0 1px #D9D4CA;image-rendering:pixelated}
.ad nav{flex:0 0 196px;padding:22px 12px;gap:18px}
.ad nav img{width:130px!important}
@media (max-width:780px){.ad nav{flex:1 1 100%}}
.combo{position:relative;min-width:260px;max-width:360px}
.combo .inp{height:40px;font-size:14px;border-radius:10px}
.clist{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(15,58,78,.14);max-height:280px;overflow-y:auto;padding:4px}
.copt{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35}
.copt b{margin-right:6px;font-size:12px}

<body>
<div id="app"></div>
<div id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const LOGO = {claro:"/logo-claro.png", escuro:"/logo-escuro.png"};
const API="https://dtrfujxhfcyefbipkcwz.supabase.co/functions/v1/full-api";
const APP_URL=location.origin+location.pathname;
const KEY="envio-full-prefs";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const now=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const prod=cod=>DB.erp[cod]?{cod,...DB.erp[cod]}:null;
const locOf=cod=>(DB.locs||{})[cod]||"";
const locOrd=cod=>{ const l=parseCode(locOf(cod)); return l?[String(typeof l.r==="number"?l.r:10+l.r.charCodeAt(0)).padStart(3,"0"),l.l,String(l.ci).padStart(3,"0"),l.n].join("|"):"zz"; };
const nomeCod=cod=>prod(cod)?prod(cod).nome:`Código ${cod}`;
const nomeU=u=>DB.users[u]?DB.users[u].nome:u;
const ROLE=()=>DB.meObj?.role||"";
const sepUsers=()=>Object.keys(DB.users).filter(u=>DB.users[u].ativo!==false);

/* preferências locais (sessão, aba, som); os dados ficam no servidor */
let PREF={}; try{ PREF=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){}
const DB={envios:[],erp:{},vinc:{},locs:{},users:{},me:null,meObj:null,tab:PREF.tab||"envios",sel:null,cur:PREF.cur||null,asExp:false,ph:{},lbl:null,mobile:null,mobileU:null,imp:null,f:{per:"todos",q:""},pg:{},mute:!!PREF.mute,qrTok:{},rev:null,carregado:false};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({token:PREF.token||null,tab:DB.tab,mute:DB.mute,cur:DB.cur})); }catch(e){} }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3200); }

/* ---------- servidor ---------- */
async function api(op,body={}){
  const h={"content-type":"application/json"};
  if(DB.qr) h["x-full-qr"]=DB.qr; else if(PREF.token) h["x-full-token"]=PREF.token;
  let r; try{ r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify({op,...body})}); }catch(e){ throw new Error("Sem conexão com o servidor. Verifique a internet."); }
  const j=await r.json().catch(()=>({erro:"Resposta inválida do servidor."}));
  if(r.status===401 && op!=="login"){ if(!DB.qr){ PREF.token=null; DB.me=null; DB.meObj=null; save(); render(); } throw new Error(j.erro||"Sessão expirada."); }
  if(j.erro) throw new Error(j.erro);
  return j;
}
function aplicar(st){
  DB.rev=st.rev; DB.meObj=st.me; DB.me=st.me.login;
  DB.users=Object.fromEntries(st.users.map(u=>[u.login,u]));
  DB.erp=Object.fromEntries(st.erp.map(p=>[p.cod,{nome:p.nome,ean:p.ean}]));
  DB.vinc=Object.fromEntries(st.vinc.map(v=>[v.inv,{cod:v.cod||"",mult:v.mult||1}]));
  DB.locs=st.locs||{}; DB.eans=st.eans||{}; BLOCKS=st.blocks||{};
  const sep={}, logs={};
  st.sep.forEach(s=>{ (sep[s.envio]=sep[s.envio]||{})[s.cod]={status:s.status,resp:s.resp,n:s.n,lab:s.lab||{}}; });
  st.logs.forEach(l=>{ (logs[l.envio]=logs[l.envio]||[]).unshift({t:new Date(l.at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),msg:l.msg}); });
  DB.envios=st.envios.map(e=>({id:e.id,criado:Date.parse(e.criado),status:e.status,pvs:e.pvs||[],anuncios:e.anuncios||[],pre:e.pre||{},manual:e.manual||{},motivo:e.motivo||"",conferido:true,sep:sep[e.id]||{},log:logs[e.id]||[]}));
  DB.carregado=true;
}
async function carregar(force){
  const st=await api("state",force?{}:{since:DB.rev});
  if(st.same) return false;
  if(!force&&typeof PEND!=="undefined"&&PEND>0) return false; /* há bipes a caminho do servidor: não sobrescreve a tela */
  aplicar(st); return true;
}
let ocupado=0;
async function acao(fn,okMsg){ ocupado++; try{ await fn(); if(okMsg) toast(okMsg); }catch(e){ toast(e.message); } finally{ ocupado--; } try{ await carregar(true); }catch(e){} render(); }
const env=id=>DB.envios.find(e=>e.id===id);
const V=inv=>DB.vinc[inv]||{cod:"",mult:1};

const preQ=(e,cod)=>Object.values(e.pre[cod]||{}).reduce((a,b)=>a+b,0)+(e.manual?.[cod]?.qtd||0);
const LUPA='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="vertical-align:-2px"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
function manualTag(e){ const m=Object.entries(e.manual||{}); if(!m.length) return ""; const t=m.map(([c,x])=>`${c} ${nomeCod(c)}: +${x.qtd} (${nomeU(x.por)})`).join("\n"); return `<span class="tag tag-acc" title="${esc(t)}">${LUPA} ${m.length} item${m.length>1?"s":""} adicionado${m.length>1?"s":""} à pré-venda</span>`; }
function pendVinc(e){ return e.anuncios.filter(a=>!V(a.inv).cod); }
function conf(e){
  const en={};
  e.anuncios.forEach(a=>{ const v=V(a.inv); if(!v.cod) return; const x=en[v.cod]||(en[v.cod]={un:0,kits:[],pecas:0});
    if(v.mult===1) x.un+=a.etiquetas; else x.kits.push({n:a.etiquetas,mult:v.mult}); x.pecas+=a.etiquetas*v.mult; });
  const cods=[...new Set([...Object.keys(en),...Object.keys(e.pre)])].sort((a,b)=>nomeCod(a).localeCompare(nomeCod(b)));
  const rows=cods.map(cod=>{ const x=en[cod]||{un:0,kits:[],pecas:0}; const p=preQ(e,cod); return {cod,x,p,d:p-x.pecas}; });
  return {rows,div:rows.filter(r=>r.d!==0),pecas:rows.reduce((s,r)=>s+r.x.pecas,0)};
}
const tot=e=>e.anuncios.reduce((s,a)=>s+a.etiquetas,0);

/* itens de separação: um por produto do ERP */
function itens(e){
  const m={};
  e.anuncios.forEach(a=>{ const v=V(a.inv); if(!v.cod) return; const it=m[v.cod]||(m[v.cod]={cod:v.cod,pecas:0,anuncios:[]}); it.pecas+=a.etiquetas*v.mult; it.anuncios.push({...a,mult:v.mult}); });
  return Object.values(m).sort((a,b)=>nomeCod(a.cod).localeCompare(nomeCod(b.cod))).map(it=>{ const s=e.sep[it.cod]||{status:"livre",n:0,lab:{}}; it.anuncios.sort((x,y)=>x.mult-y.mult); return {...it,s,etq:it.anuncios.reduce((t,a)=>t+a.etiquetas,0),lab:it.anuncios.reduce((t,a)=>t+Math.min(s.lab?.[a.inv]||0,a.etiquetas),0)}; });
}
const sepOf=(e,cod)=>e.sep[cod]||(e.sep[cod]={status:"livre",n:0,lab:{}});
const compo=it=>it.anuncios.map(a=>a.mult===1?`${a.etiquetas} unid.`:`${a.etiquetas} kit${a.etiquetas>1?"s":""} de ${a.mult}`).join(" + ");
const etqDone=e=>itens(e).reduce((t,i)=>t+i.lab,0);
const tudoEtiquetado=e=>itens(e).every(i=>i.s.status==="etiquetado");
function statusTag(e){
  if(e.status==="rascunho") return pendVinc(e).length?`<span class="tag tag-warn">Rascunho · ${pendVinc(e).length} vínculo pendente</span>`:`<span class="tag tag-acc">Rascunho · pronto p/ liberar</span>`;
  if(e.status==="concluido") return `<span class="tag tag-ok">Concluído</span>`;
  const its=itens(e); const mov=its.some(i=>i.s.status!=="livre");
  return mov?`<span class="tag tag-acc">Em preparo · ${its.filter(i=>i.s.status==="etiquetado").length}/${its.length} itens</span>`:`<span class="tag tag-off">Na fila da expedição</span>`;
}
const ST={livre:["Livre","tag-off"],separando:["Separando","tag-acc"],coletado:["Pronto p/ etiquetar","tag-warn"],impresso:["Etiquetando","tag-warn"],etiquetado:["Etiquetado","tag-ok"]};
function stTag(it){ const [l,c]=ST[it.s.status]; return `<span class="tag ${c}">${l}${it.s.resp&&it.s.status==="separando"?` · ${esc(nomeU(it.s.resp))}`:""}</span>`; }
function logE(e,msg){ e.log.push({t:now(),msg}); if(e.log.length>200) e.log.shift(); }

let actx=null;
function beep(ok){ if(DB.mute) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  (ok?[[1320,.07]]:[[220,.12],[180,.16]]).forEach(([f,d])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=f; o.type=ok?"sine":"square"; g.gain.value=.08; o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d); t+=d+.04; }); }catch(x){} }

const MODOS=[["camera","Câmera do celular"],["bluetooth","Leitor Bluetooth"],["coletor","Coletor de dados"]];
const modoTxt=m=>(MODOS.find(x=>x[0]===m)||MODOS[0])[1];
const modoDe=u=>(DB.users[u]&&DB.users[u].modo)||"camera";

/* EAN para validar o bipe: sempre o cadastro do app de Picking */
const eanOf=cod=>((DB.eans||{})[cod]||"").trim();
/* teclado do celular no campo de bipe: o coletor costuma precisar dele ativo para entregar o código; escolha fica salva no aparelho */
const tecladoOn=md=>{ const v=localStorage.getItem("envio-full-teclado-"+md); return v===null?md==="coletor":v==="1"; };
/* parsers compartilhados (navegador e node) */
function zplDecode(s){ return s.replace(/(?:_[0-9A-F]{2})+/g, m=>{ const b=m.split("_").filter(Boolean).map(h=>parseInt(h,16)); try{ return new TextDecoder().decode(new Uint8Array(b)); }catch(e){ return m; } }); }
function parseZPL(text){
  const re=/\^BCN,[^\^]*\^FD(\w+)\^FS[\s\S]*?\^FB300,2,2,L\^FH\^FD([\s\S]*?)\^FS[\s\S]*?\^FH\^FD((?:SKU|Universal Code): [^\n\r]*)/g;
  const map=new Map(); let m;
  while((m=re.exec(text))){ const inv=m[1]; const a=map.get(inv)||{inv,titulo:zplDecode(m[2]).trim().replace(/\s+/g," "),ref:zplDecode(m[3]).trim(),etiquetas:0}; a.etiquetas++; map.set(inv,a); }
  return [...map.values()];
}
function sugestaoVinc(a){
  const k=(a.titulo.match(/^(?:kit\s*(?:com\s*)?)?(\d+)\s*(?:x|un\.?|unid\w*|p[çc]s?)\s/i)||a.titulo.match(/\bkit\s*(?:com\s*)?(\d+)\s*(?:x|un\.?|unid\w*|p[çc]s?)?\s/i)||[])[1]; const s=a.ref.match(/^SKU: (\d+)(?:-0*(\d+))?/);
  const mult=k?+k:(s&&s[2]?+s[2]:1);
  return {cod:s?s[1]:"",mult};
}
function parsePrevendaLines(lines){
  const pv=((lines.join("\n").match(/Pré-venda\s*-\s*(\d+)/)||[])[1])||"";

}
async function lerEtqFiles(files){ const map=new Map(); let id=null;
  for(const f of files){ const m=f.name.match(/Envio-(\d+)/); if(m) id=m[1]; parseZPL(await f.text()).forEach(a=>{ const x=map.get(a.inv); if(x) x.etiquetas+=a.etiquetas; else map.set(a.inv,a); }); }
  return {id,anuncios:[...map.values()]}; }
async function lerPreFiles(files){ if(!window.pdfjsLib) throw new Error("o leitor de PDF não carregou. Verifique a conexão e tente de novo");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pre={}, pvs=[], erp={};
  for(const f of files){ const r=parsePrevendaLines(await pdfLines(pdfjsLib,new Uint8Array(await f.arrayBuffer()))); if(!r.itens.length) throw new Error(`não reconheci itens em ${f.name}`);
    const pv=r.pv||f.name; pvs.push(pv); r.itens.forEach(it=>{ (pre[it.cod]=pre[it.cod]||{})[pv]=((pre[it.cod]||{})[pv]||0)+it.qtd; erp[it.cod]={nome:it.nome,ean:it.ean}; }); }
  return {pre,pvs,erp}; }
async function atualizarEnvio(input){ const id=input.dataset.id, files=[...input.files]; input.value=""; if(!files.length) return;
  try{ if(input.id==="fUpEtq"){ const r=await lerEtqFiles(files); if(!r.anuncios.length) return toast("Nenhuma etiqueta encontrada");
      if(r.id&&r.id!==id) return toast("Arquivos de outro envio");
      const vinc={}; r.anuncios.forEach(a=>{ if(DB.vinc[a.inv]?.cod) return; const s=sugestaoVinc(a); vinc[a.inv]={cod:DB.erp[s.cod]?s.cod:"",mult:s.mult}; });
      const antes=env(id), n0=antes?tot(antes):0, n1=r.anuncios.reduce((t,a)=>t+a.etiquetas,0);
      acao(()=>api("atualizar",{id,anuncios:r.anuncios,vinc}),"Etiquetas atualizadas"); }
    else { const r=await lerPreFiles(files); acao(()=>api("atualizar",{id,pre:r.pre,pvs:r.pvs,erp:r.erp}),"Pré-venda atualizada"); } }
  catch(x){ toast("Arquivo não reconhecido"); }
}
async function lerArquivos(input){
  const I=DB.imp||(DB.imp={anuncios:[],pre:{},pvs:[],vinc:{},erpNovos:{}});
  I.msg=null;
  try{
    if(input.id==="fEtq"){
      const map=new Map(); let id=I.id;
      for(const f of input.files){ const m=f.name.match(/Envio-(\d+)/); if(m) id=m[1];
        parseZPL(await f.text()).forEach(a=>{ const x=map.get(a.inv); if(x) x.etiquetas+=a.etiquetas; else map.set(a.inv,a); }); }
      if(!map.size){ I.msg="Não encontrei etiquetas nesses arquivos. Use os .txt da impressora térmica que o Mercado Livre gera."; }
      I.anuncios=[...map.values()]; I.id=id||String(Date.now()).slice(-8); I.nEtqFiles=input.files.length;
    } else {
      if(!window.pdfjsLib){ I.msg="O leitor de PDF não carregou. Verifique a conexão e tente de novo."; render(); return; }
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      I.pre={}; I.pvs=[]; I.erpNovos={};
      for(const f of input.files){ const lines=await pdfLines(pdfjsLib,new Uint8Array(await f.arrayBuffer())); const r=parsePrevendaLines(lines);
        if(!r.itens.length){ I.msg=`Não reconheci itens em ${f.name}.`; continue; }
        const pv=r.pv||f.name; I.pvs.push(pv);
        r.itens.forEach(it=>{ (I.pre[it.cod]=I.pre[it.cod]||{})[pv]=((I.pre[it.cod]||{})[pv]||0)+it.qtd; I.erpNovos[it.cod]={nome:it.nome,ean:it.ean}; }); }
    }
    I.vinc={}; I.anuncios.forEach(a=>{ if(DB.vinc[a.inv]?.cod){ I.vinc[a.inv]=DB.vinc[a.inv]; return; } const s=sugestaoVinc(a); I.vinc[a.inv]={cod:(DB.erp[s.cod]||I.erpNovos[s.cod])?s.cod:"",mult:s.mult}; });
  }catch(x){ I.msg="Não consegui ler o arquivo: "+x.message; }
  save(); render();
}

async function mlPendente(){ const u=new URL(location.href), code=u.searchParams.get("code"), st=u.searchParams.get("state"); if(!code) return;
  history.replaceState(null,"",location.pathname+location.hash);
  if(!DB.me||DB.meObj?.role!=="gestor"){ toast("Entre como gestor para conectar"); return; }
  if(st!==localStorage.getItem("envio-full-mlstate")){ toast("Autorização inválida, tente de novo"); return; }
  localStorage.removeItem("envio-full-mlstate"); DB.tab="estoque"; DB.mlSync=true; render(); toast("Conectando ao Mercado Livre…");
  try{ await api("ml_callback",{code}); toast("Mercado Livre conectado"); }catch(x){ toast(x.message); }

function mlCalc(){ const c=DB.ml||{}, dias=c.dias||30; const custo={}; (c.custos||[]).forEach(x=>custo[x.cod]=+x.custo);
  const R={}; (c.resumo||[]).forEach(r=>{ (R[r.inv]=R[r.inv]||{})[r.tipo]={d:+r.disp||0,i:+r.indisp||0,n:+r.n||0}; });
  const q=(inv,t,campo)=>{ const x=(R[inv]||{})[t]; if(!x) return 0; const v=Math.abs(campo==="t"?x.d+x.i:x.d); return v||x.n; };
  const linhas=(c.estoque||[]).map(e=>{ const v=V(e.inv), mult=v.mult||1, cod=v.cod||"", cu=cod&&custo[cod]!==undefined?custo[cod]:null;
    const vend=Math.max(0,q(e.inv,"sale_confirmation","d")-q(e.inv,"sale_cancelation","d"));
    const ent=q(e.inv,"inbound_reception","t"), dev=q(e.inv,"sale_return","t")+q(e.inv,"sale_delivery_cancelation","t");
    const md=vend/dias, cob=md>0?e.disponivel/md:null;
    return {...e,cod,mult,cu,vend,ent,dev,md,cob,custoDisp:cu!==null?e.disponivel*mult*cu:null,custoTot:cu!==null?e.total*mult*cu:null,pecas:e.disponivel*mult}; });
  const ativos=linhas.filter(l=>l.total>0);
  const modelos=new Set(ativos.filter(l=>l.cod).map(l=>l.cod));
  const comCob=ativos.filter(l=>l.cob!==null&&l.custoDisp);
  const pes=comCob.reduce((t,l)=>t+l.custoDisp,0);
  const cobMedia=comCob.length?(pes>0?comCob.reduce((t,l)=>t+l.cob*l.custoDisp,0)/pes:comCob.reduce((t,l)=>t+l.cob,0)/comCob.length):null;
  return {linhas,ativos,dias,modelos:modelos.size,cobMedia,
    custoDisp:ativos.reduce((t,l)=>t+(l.custoDisp||0),0), custoTot:ativos.reduce((t,l)=>t+(l.custoTot||0),0),
    semCusto:ativos.filter(l=>l.cu===null).length, semVinc:ativos.filter(l=>!l.cod).length, semVenda:ativos.filter(l=>l.cob===null&&l.disponivel>0).length,
    pecas:ativos.reduce((t,l)=>t+l.pecas,0), unid:ativos.reduce((t,l)=>t+l.disponivel,0), indisp:ativos.reduce((t,l)=>t+l.indisponivel,0),
    ent:linhas.reduce((t,l)=>t+l.ent,0), dev:linhas.reduce((t,l)=>t+l.dev,0), vend:linhas.reduce((t,l)=>t+l.vend,0)}; }

/* planilha de custos: SKU + custo (aceita .xlsx e .csv) */
async function lerCustos(input){ const f=input.files[0]; input.value=""; if(!f) return;
  try{ let rows;
    if(/\.csv$/i.test(f.name)){ const t=await f.text(); const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":",";
      rows=t.split(/\r?\n/).filter(Boolean).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim())); }
    else { if(!window.XLSX) await new Promise((ok,er)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload=ok; sc.onerror=()=>er(new Error("leitor de planilha não carregou")); document.head.appendChild(sc); }); const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true}); }
    const h=(rows[0]||[]).map(x=>String(x||"").toLowerCase());
    const iS=h.findIndex(x=>/sku|c[oó]d/.test(x)), iC=h.findIndex(x=>/custo|pre[cç]o/.test(x)), iD=h.findIndex(x=>/descri/.test(x));
    if(iS<0||iC<0) throw new Error("não achei as colunas SKU e Custo");
    const num=v=>typeof v==="number"?v:parseFloat(String(v||"").replace(/[R$\s.]/g,"").replace(",","."));
    const itens=rows.slice(1).map(r=>({cod:String(r[iS]??"").trim(),descricao:iD>=0?String(r[iD]??""):"",custo:num(r[iC])})).filter(x=>x.cod&&isFinite(x.custo));
    if(!itens.length) throw new Error("nenhuma linha com SKU e custo");
    const r=await api("custos",{itens}); toast(`Custos atualizados · ${n0(r.n)} SKUs`); await mlCarregar();
  }catch(x){ toast("Planilha não reconhecida"); console.warn(x); }
}

      <p class="hint" style="font-size:15px">${tot(e)} etiquetas coladas em ${conf(e).pecas} peças.${e.motivo?` Diferença registrada: “${esc(e.motivo)}”.`:""}</p>

let FILA=Promise.resolve();
let PEND=0;
function enfileira(fn){ PEND++; FILA=FILA.then(fn).catch(()=>{}).finally(()=>{ PEND--; }); return FILA; }
/* ação do celular com resposta imediata: aplica na tela já e confirma no servidor em segundo plano */
function otim(e,cod,acaoNome,extra,msg,aplica){
  const s=sepOf(e,cod); const antes=JSON.parse(JSON.stringify(s)); aplica(s);
  enfileira(async()=>{ try{ const r=await api("sep",{envio:e.id,cod,acao:acaoNome,msg,...extra}); if(r.erro) throw new Error(r.erro);
      if(r.sep) Object.assign(s,{status:r.sep.status,resp:r.sep.resp,n:r.sep.n,lab:r.sep.lab||{}}); }
    catch(x){ Object.assign(s,antes); toast(x.message); beep(false); try{ await carregar(true); }catch(_){} render(); } });
}
/* compara o bipe com o EAN aceitando o que leitores/coletores costumam acrescentar:
   prefixo de símbolo (ex.: ]E0), Tab/Enter, espaços, zero à esquerda (UPC-A × EAN-13) */
function eanBate(code,ean){ const c=String(code||"").replace(/\D/g,""), e=String(ean||"").replace(/\D/g,""); if(!c||!e) return false;
  return c===e || c.replace(/^0+/,"")===e.replace(/^0+/,"") || (c.length>e.length&&c.endsWith(e)) || (c.length>e.length&&c.startsWith(e)&&c.length-e.length<=2); }
function phScan(e,u,code){
  const key=DB.mobile?"_m":u; const ph=DB.ph[key]; const it=itens(e).find(i=>i.cod===ph.cod); const s=sepOf(e,ph.cod);
  if(!it||s.resp!==u) return;
  if(code!==null && !eanOf(it.cod)){ ph.msg={ok:false,t:"EAN não cadastrado no Picking"}; beep(false); return; }
  if(code!==null){ ph.lido=String(code).replace(/[\x00-\x1f]/g,"⏎").slice(0,40); }
  if(code!==null && !eanBate(code,eanOf(it.cod))){ ph.msg={ok:false,t:"Produto incorreto"}; beep(false); return; }
  if(s.n>=it.pecas){ ph.msg={ok:false,t:"Peças completas"}; beep(false); return; }
  s.n++; ph.msg={ok:true,t:s.n>=it.pecas?"Separação concluída":`Produto conferido · ${s.n}/${it.pecas}`}; beep(true);

let CAM=null;
async function camLiga(e,u){

    v.srcObject=st; await v.play(); w.hidden=false; CAM={st,ultimo:"",t:0}; const o=$("#camopen"); if(o) o.hidden=true;
    const loop=async()=>{ if(!CAM) return; try{ const r=await det.detect(v); if(r[0]){ const c=r[0].rawValue, agora=Date.now(); if(c!==CAM.ultimo||agora-CAM.t>1200){ CAM.ultimo=c; CAM.t=agora; phScan(e,u,c); atualizaPick(); } } }catch(x){} if(CAM) setTimeout(loop,250); };

document.addEventListener("focusin",ev=>{ if(ev.target.dataset?.vq!==undefined){ ev.target.select(); comboBusca(ev.target); } });
document.addEventListener("input",ev=>{ if(ev.target.dataset?.vq!==undefined) comboBusca(ev.target);
  if(ev.target.id==="mlQ"){ DB.mlQ=ev.target.value; DB.pg.mla=1; DB.pg.mlm=1; const pos=ev.target.selectionStart; render(); const n=$("#mlQ"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } return; }
  if(ev.target.id==="fq"){ DB.f.q=ev.target.value; DB.pg.envios=1; $("#elist").innerHTML=gEnviosList(); } });
document.addEventListener("keydown",ev=>{ const t=ev.target; if(t.dataset?.vq===undefined) return; const opts=[...t.nextElementSibling.querySelectorAll(".copt")]; let i=opts.findIndex(o=>o.classList.contains("on"));
  if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ ev.preventDefault(); if(!opts.length) return; opts[i]?.classList.remove("on"); i=(i+(ev.key==="ArrowDown"?1:-1)+opts.length)%opts.length; opts[i].classList.add("on"); opts[i].scrollIntoView({block:"nearest"}); }
  else if(ev.key==="Enter"&&opts[i]){ ev.preventDefault(); opts[i].click(); }
  else if(ev.key==="Escape"){ t.nextElementSibling.hidden=true; } });
window.addEventListener("hashchange",()=>{ rota(); DB.carregado=false; iniciar(); });
iniciar();
document.addEventListener("toggle",ev=>{ const d=ev.target; if(d.dataset&&d.dataset.an!==undefined){ if(d.open) DB.openAn=d.dataset.an; else if(DB.openAn===d.dataset.an) DB.openAn=null; } },true);

</script>
</body>
</html>
